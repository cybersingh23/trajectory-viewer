<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trajectory Viewer</title>
<style>
/* ═══ RESET & BASE ═══ */
:root {
  --bg: #06060e;
  --glass: rgba(255,255,255,0.035);
  --glass-border: rgba(255,255,255,0.07);
  --glass-hover: rgba(255,255,255,0.06);
  --glass-hover-border: rgba(255,255,255,0.12);
  --text: #e2e8f0;
  --text-sec: #94a3b8;
  --text-muted: #64748b;
  --text-dim: #334155;
  --blue: #60a5fa;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;
  --purple: #a78bfa;
  --cyan: #22d3ee;
  --radius: 14px;
  --radius-sm: 8px;
  --mono: 'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;overflow:hidden;position:relative}

/* ═══ BACKGROUND ORBS ═══ */
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px)}
.orb-1{width:700px;height:700px;background:rgba(99,102,241,0.07);top:-15%;left:5%;animation:f1 25s ease-in-out infinite}
.orb-2{width:500px;height:500px;background:rgba(139,92,246,0.05);bottom:0;right:5%;animation:f2 30s ease-in-out infinite}
.orb-3{width:400px;height:400px;background:rgba(14,165,233,0.04);top:40%;left:45%;animation:f3 20s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,40px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-50px)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}

/* ═══ GLASS ═══ */
.glass{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.03)}

/* ═══ LOADER ═══ */
#loader{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:24px}
.loader-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.loader-sub{color:var(--text-muted);font-size:12px;margin-top:-16px}
.drop-zone{width:520px;padding:60px 40px;text-align:center;border:2px dashed rgba(255,255,255,0.08);border-radius:20px;cursor:pointer;transition:all .3s;background:rgba(255,255,255,0.015)}
.drop-zone:hover,.drop-zone.over{border-color:var(--blue);background:rgba(96,165,250,0.03)}
.drop-zone.loaded{border-color:var(--green);border-style:solid;background:rgba(74,222,128,0.03)}
.dz-icon{font-size:36px;margin-bottom:12px;opacity:0.5}
.drop-zone h2{color:var(--text-sec);font-size:15px;font-weight:600;margin-bottom:6px}
.drop-zone p{color:var(--text-muted);font-size:11px;line-height:1.6}
.drop-zone.loaded h2{color:var(--green)}
.drop-zone.loaded .dz-icon{opacity:1}
.load-status{color:var(--text-muted);font-size:11px;min-height:16px}
.launch-btn{padding:12px 36px;border-radius:10px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;opacity:0.3;pointer-events:none;box-shadow:0 4px 20px rgba(99,102,241,0.3)}
.launch-btn.ready{opacity:1;pointer-events:auto}
.launch-btn.ready:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(99,102,241,0.4)}
input[type=file]{display:none}

/* ═══ APP SHELL ═══ */
#app{position:relative;z-index:1;display:none;flex-direction:column;height:100vh}
.topbar{background:rgba(8,8,22,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:0 20px;display:flex;align-items:stretch;flex-shrink:0;min-height:46px;z-index:10}
.task-title{display:flex;align-items:center;gap:8px;margin-right:16px;flex-shrink:0;overflow:hidden}
.task-title .tt-name{color:var(--text);font-size:13px;font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-badge{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;background:rgba(255,255,255,0.05);color:var(--text-sec);border:1px solid rgba(255,255,255,0.05);white-space:nowrap}
.tt-badge.warn{color:var(--red);background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.15)}
.tt-badge.tt-lang{color:var(--cyan);background:rgba(34,211,238,0.08);border-color:rgba(34,211,238,0.12)}
.tt-badge.tt-easy{color:var(--green);background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.12)}
.tt-badge.tt-med{color:var(--amber);background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.12)}
.tt-badge.tt-hard{color:var(--red);background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.12)}
.tt-badge.tt-turns{color:var(--text-sec)}
.tabs{display:flex;align-items:stretch;overflow-x:auto;flex:1;gap:2px}
.tab{padding:10px 20px;cursor:pointer;color:var(--text-muted);font-size:12px;font-weight:600;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text-sec);background:rgba(255,255,255,0.02)}
.tab.active{color:var(--text);border-bottom-color:var(--blue)}
.tab.overview-tab{color:var(--purple)}
.tab.overview-tab.active{color:var(--purple);border-bottom-color:var(--purple)}
.tab .t-status{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.t-ok{background:var(--green)}.t-warn{background:var(--red)}
.topbar .actions{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:12px;flex-shrink:0}
.topbar .act-btn{padding:6px 14px;cursor:pointer;color:var(--text-muted);font-size:11px;border:1px solid var(--glass-border);border-radius:7px;background:transparent;font-family:inherit;transition:all .15s}
.topbar .act-btn:hover{color:var(--text-sec);border-color:var(--glass-hover-border);background:rgba(255,255,255,0.03)}
#compare-view,#model-view{animation:viewEnter .3s ease-out}
@keyframes viewEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ═══ OVERVIEW VIEW ═══ */
#compare-view{flex:1;overflow-y:auto;padding:28px;display:none}
.cv-task-header{margin-bottom:20px;padding:20px 24px;font-size:13px;color:var(--text-sec);line-height:1.7}
.cv-task-name{font-size:18px;font-weight:700;color:var(--text);margin:0 0 8px 0;letter-spacing:-0.3px}
.cv-task-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cv-problem-inner summary{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:0.3px;cursor:pointer;outline:none;padding:2px 0;text-transform:uppercase;letter-spacing:0.8px;font-size:10px}
.cv-problem-inner summary::-webkit-details-marker{color:var(--text-dim)}
.cv-problem-text{margin-top:10px;white-space:pre-wrap}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.metric-card{padding:18px;transition:all .2s;cursor:pointer}
.metric-card:hover{border-color:var(--glass-hover-border);background:var(--glass-hover);transform:translateY(-2px)}
.mc-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.mc-name .mc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.mc-label{color:var(--text-muted);font-size:11px}
.mc-value{font-size:12px;font-weight:700;font-family:var(--mono)}
.progress-track{background:rgba(255,255,255,0.04);border-radius:6px;height:5px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.pf-green{background:linear-gradient(90deg,#22c55e,#4ade80)}
.pf-blue{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.pf-red{background:linear-gradient(90deg,#dc2626,#f87171)}
.pf-amber{background:linear-gradient(90deg,#d97706,#fbbf24)}
.mc-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.mc-tool-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)}

.cv-table-wrap{padding:20px}
.cv-table-wrap h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin-bottom:12px;font-weight:700}
.cv-table{width:100%;border-collapse:separate;border-spacing:0}
.cv-table th{padding:10px 16px;text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-sec);font-weight:700;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--glass-border)}
.cv-table th:first-child{text-align:left;width:60px}
.cv-table td{padding:10px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text);vertical-align:middle;text-align:center}
.cv-table tr:hover td{background:rgba(255,255,255,0.02)}
.cv-table td:first-child{font-weight:700;color:var(--text);text-align:left}
.cell-pass{color:var(--green);font-size:14px}.cell-fail{color:var(--red);font-size:14px}.cell-wip{color:var(--amber);font-size:12px}
.cell-turns{font-family:var(--mono);font-size:11px;color:var(--text-sec);margin-left:5px}

/* ═══ MODEL VIEW ═══ */
#model-view{flex:1;display:none;flex-direction:column;overflow:hidden}
.mv-body{display:flex;flex:1;overflow:hidden}
.convo{flex:1;overflow-y:auto;padding:0 0 80px}
.turn-group{border-bottom:1px solid rgba(255,255,255,0.05)}
.turn-group.ms-start{border-top:2px solid #818cf8;margin-top:8px}
.turn-group.ms-start>.turn-header{background:rgba(129,140,248,0.04)}
.turn-header{padding:10px 24px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;transition:background .15s}
.turn-header:hover{background:rgba(255,255,255,0.02)}
.turn-header .arrow{color:var(--text-muted);font-size:10px;transition:transform .15s;width:14px;flex-shrink:0}
.turn-header .arrow.open{transform:rotate(90deg)}
.turn-num{font-size:11px;font-weight:700;color:var(--blue);flex-shrink:0}
.turn-preview{color:var(--text-muted);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn-body{display:none}.turn-body.open{display:block}
.ms-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:800;background:rgba(129,140,248,0.15);color:#818cf8;margin-left:4px}

.msg-user{padding:14px 20px;border-left:3px solid rgba(255,255,255,0.15);margin:12px 24px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:rgba(255,255,255,0.02)}
.msg-user-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:6px;font-weight:700}
.msg-user-text{color:var(--text);font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg-asst{margin:0 24px 12px 48px;padding:0 0 0 16px;border-left:1px solid rgba(255,255,255,0.04)}
.step-header{padding:8px 0 4px;color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.asst-text{padding:8px 12px;margin:4px 0;color:var(--text-sec);font-size:13px;line-height:1.7;white-space:pre-wrap;border-radius:var(--radius-sm);background:rgba(255,255,255,0.015)}

/* ═══ TOOL BLOCKS ═══ */
.tool-block{margin:4px 0;border:1px solid rgba(255,255,255,0.04);border-radius:var(--radius-sm);background:rgba(255,255,255,0.015);overflow:hidden;border-left:3px solid rgba(255,255,255,0.06)}
.tool-block.tbl-bash{border-left-color:var(--blue)}.tool-block.tbl-read{border-left-color:var(--green)}.tool-block.tbl-edit{border-left-color:var(--amber)}.tool-block.tbl-apply_patch{border-left-color:#fb923c}.tool-block.tbl-write{border-left-color:var(--cyan)}.tool-block.tbl-grep{border-left-color:var(--purple)}.tool-block.tbl-glob{border-left-color:var(--purple)}.tool-block.tbl-agent{border-left-color:#f0abfc}.tool-block.tbl-question{border-left-color:#f0abfc}.tool-block.tbl-task{border-left-color:#a8a29e}
.tool-header{padding:6px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.tool-header:hover{background:rgba(255,255,255,0.02)}
.tool-header .arrow{color:var(--text-dim);font-size:10px;transition:transform .15s;width:14px;flex-shrink:0}
.tool-header .arrow.open{transform:rotate(90deg)}
.tool-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(255,255,255,0.04);font-family:var(--mono);flex-shrink:0}
.tb-bash{color:var(--blue)}.tb-read{color:var(--green)}.tb-edit{color:var(--amber)}.tb-grep{color:var(--purple)}.tb-glob{color:var(--purple)}.tb-write{color:var(--cyan)}.tb-apply_patch{color:#fb923c}.tb-task{color:#a8a29e}.tb-question{color:#f0abfc}
.tool-title{color:var(--text-sec);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-dur{color:var(--text-dim);font-size:10px;font-family:var(--mono);flex-shrink:0}
.tool-body{display:none;padding:8px 10px;border-top:1px solid rgba(255,255,255,0.04)}.tool-body.open{display:block}
.codeblock{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.04);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:var(--mono);line-height:1.6;margin:4px 0;max-height:400px;overflow-y:auto;color:var(--text-sec)}
.codeblock .cmd{color:var(--text)}.codeblock .out{color:var(--text-muted)}
.diff{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.04);border-radius:6px;padding:10px 12px;overflow-x:auto;font-size:11px;font-family:var(--mono);line-height:1.6;margin:4px 0;max-height:400px;overflow-y:auto}
.diff .del{background:rgba(239,68,68,0.08);color:var(--red);display:block}.diff .add{background:rgba(74,222,128,0.08);color:var(--green);display:block}
.empty-resp{padding:8px 12px;color:var(--text-dim);font-size:12px;font-style:italic;margin:4px 0}

/* ═══ ASK & TODO RENDERERS ═══ */
.ask-block{margin:4px 0}
.ask-q{margin-bottom:8px}
.ask-label{font-size:9px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px}
.ask-text{font-size:12px;color:var(--text);line-height:1.6;padding:6px 10px;border-left:2px solid rgba(240,171,252,0.25);background:rgba(240,171,252,0.02);border-radius:0 4px 4px 0}
.ask-opts{margin-top:6px;padding-left:14px}
.ask-opt{font-size:11px;color:var(--text-sec);line-height:1.7}
.ask-opt::before{content:'\2192';color:var(--purple);margin-right:6px;font-size:10px}
.ask-opt-desc{color:var(--text-muted);font-size:10px;margin-left:2px}
.todo-list{margin:4px 0;display:flex;flex-direction:column;gap:3px}
.todo-item{display:flex;align-items:flex-start;gap:8px;padding:5px 10px;border-radius:5px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.015);font-size:11px;line-height:1.4}
.todo-check{flex-shrink:0;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--text-dim);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px}
.todo-item.td-completed .todo-check{border-color:var(--green);color:var(--green)}
.todo-item.td-in_progress .todo-check{border-color:var(--amber);color:var(--amber)}
.todo-item.td-pending .todo-check{border-color:var(--text-dim)}
.todo-content{flex:1;color:var(--text-sec)}
.todo-item.td-completed .todo-content{text-decoration:line-through;color:var(--text-muted)}
.todo-priority{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:1px 5px;border-radius:3px;flex-shrink:0}
.todo-priority.tp-high{color:var(--red);background:rgba(248,113,113,0.08)}
.todo-priority.tp-medium{color:var(--amber);background:rgba(251,191,36,0.08)}
.todo-priority.tp-low{color:var(--text-muted);background:rgba(255,255,255,0.04)}

/* ═══ RIGHT SIDEBAR ═══ */
.sidebar{width:300px;min-width:280px;border-left:1px solid var(--glass-border);overflow-y:auto;flex-shrink:0;background:rgba(255,255,255,0.01)}
.sidebar.hidden{display:none}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--glass-border)}
.sidebar-tab{flex:1;padding:10px;text-align:center;font-size:11px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.sidebar-tab:hover{color:var(--text-sec)}
.sidebar-tab.active{color:var(--text);border-bottom-color:var(--blue)}
.sidebar-content{padding:12px}
.sidebar-pane{display:none}
.sidebar-pane.active{display:block}

/* Milestone cards */
.ms-panel h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:4px 6px;margin-bottom:6px;font-weight:700}
.ms-card{padding:10px 12px;margin-bottom:6px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.015);cursor:pointer;transition:all .15s}
.ms-card:hover{border-color:var(--glass-hover-border);background:var(--glass-hover)}
.ms-card.ms-done{border-left:3px solid var(--green)}
.ms-card.ms-active{border-left:3px solid var(--amber)}
.ms-card.ms-pending{border-left:3px solid var(--text-dim)}
.ms-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ms-id{font-size:11px;font-weight:800;color:var(--text);background:rgba(129,140,248,0.12);padding:2px 8px;border-radius:4px}
.ms-status{font-size:10px;text-transform:capitalize;font-weight:600}
.ms-status-completed{color:var(--green)}.ms-status-in_progress{color:var(--amber)}.ms-status-pending,.ms-status-not_started{color:var(--text-dim)}
.ms-prompt{color:var(--text-muted);font-size:11px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.ms-meta{font-size:10px;color:var(--text-dim);font-family:var(--mono);display:flex;gap:10px}
.ms-meta .int-ct{color:var(--purple)}

/* Save turn button */
.save-turn-btn{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-sec);padding:2px 6px;transition:all .15s;flex-shrink:0;line-height:1;opacity:0.7}
.save-turn-btn:hover{opacity:1;color:var(--amber);transform:scale(1.15)}
.save-turn-btn.saved{opacity:1;color:var(--amber)}

/* Saved cards in sidebar */
.saved-card{padding:10px 12px;margin-bottom:6px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.015);cursor:pointer;transition:all .15s}
.saved-card:hover{border-color:var(--glass-hover-border);background:var(--glass-hover)}
.saved-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.saved-model{font-size:10px;font-weight:700;color:var(--blue);background:rgba(96,165,250,0.1);padding:2px 7px;border-radius:4px}
.saved-prompt{font-size:10px;font-weight:700;color:var(--text);flex:1}
.saved-remove{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:10px;padding:2px 4px;transition:color .15s;line-height:1}
.saved-remove:hover{color:var(--red)}
.saved-preview{color:var(--text-muted);font-size:11px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.saved-note{font-size:10px;color:var(--amber);margin-top:4px;padding:3px 6px;background:rgba(251,191,36,0.06);border-radius:4px;border-left:2px solid var(--amber);line-height:1.3}
.saved-clear-btn{padding:4px 12px;cursor:pointer;font-size:10px;font-weight:600;border-radius:4px;border:1px solid rgba(248,113,113,0.2);background:transparent;color:var(--red);font-family:inherit;transition:all .15s}
.saved-clear-btn:hover{background:rgba(248,113,113,0.06);border-color:rgba(248,113,113,0.4)}

/* Toast */

</head>
<body>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div id="loader">
  <div class="loader-title">Trajectory Viewer</div>
  <div class="loader-sub">Multi-model trajectory analysis</div>
  <div class="drop-zone glass" id="drop-zone">
    <div class="dz-icon">&#128193;</div>
    <h2>Drop files or a folder here</h2>
    <p>Drop <b>trajectory JSON files</b> (one per model)<br>
    Or a folder with <b>vm-*</b> model directories containing task.json + trajectories/<br><br>
    <span style="color:var(--text-dim)">Supports flat trajectory format &amp; opencode format</span></p>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
      <button class="act-btn" type="button" onclick="event.stopPropagation();document.getElementById('fi-files').click()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.03);color:var(--text-sec);font-family:inherit;font-size:11px;cursor:pointer">Pick JSON files…</button>
      <button class="act-btn" type="button" onclick="event.stopPropagation();document.getElementById('fi-folder').click()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.03);color:var(--text-sec);font-family:inherit;font-size:11px;cursor:pointer">Pick folder…</button>
    </div>
  </div>
  <div class="load-status" id="load-status"></div>
  <button class="launch-btn" id="launch-btn" onclick="launch()">Launch Viewer</button>
  <input type="file" id="fi-folder" webkitdirectory multiple>
  <input type="file" id="fi-files" multiple accept=".json,.jsonl">
</div>

<div id="app">
  <div class="topbar" id="topbar"></div>
  <div id="compare-view"></div>
  <div id="model-view">
    <div class="mv-body">
      <div class="convo" id="convo"></div>
      <div class="sidebar hidden" id="sidebar">
        <div class="sidebar-tabs">
          <div class="sidebar-tab active" data-pane="milestones" onclick="switchSidebarTab('milestones')">Milestones</div>
          <div class="sidebar-tab" data-pane="saved" onclick="switchSidebarTab('saved')">Saved</div>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-pane active" id="pane-milestones"></div>
          <div class="sidebar-pane" id="pane-saved"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="sbs-view"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
var STATE = {
  task: null,
  models: {},
  modelOrder: [],
  activeTab: 'compare',
  allCollapsed: false,
  savedTurns: [],
  sbsPair: { a: null, b: null },
  sbsAnchors: null
};
var LABELS = {bash:'Bash',read:'Read',edit:'Edit',grep:'Grep',glob:'Glob',write:'Write',task:'Task',apply_patch:'Patch',question:'Ask',todowrite:'Todo',agent:'Agent'};

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2000);
}

/* ═══════════════════════════════════════════════════════════
   FILE UPLOAD
   ═══════════════════════════════════════════════════════════ */
var dz = document.getElementById('drop-zone');
var fiFolder = document.getElementById('fi-folder');
var fiFiles = document.getElementById('fi-files');
var statusEl = document.getElementById('load-status');
var launchBtn = document.getElementById('launch-btn');

dz.addEventListener('click', function() { fiFiles.click(); });
dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', function() { dz.classList.remove('over'); });
dz.addEventListener('drop', function(e) {
  e.preventDefault(); dz.classList.remove('over');
  var items = e.dataTransfer.items;
  if (items && items.length && items[0].webkitGetAsEntry) {
    var entries = [];
    for (var i = 0; i < items.length; i++) { var en = items[i].webkitGetAsEntry(); if (en) entries.push(en); }
    readEntries(entries);
  } else {
    handleFileList(e.dataTransfer.files);
  }
});
fiFolder.addEventListener('change', function(e) { handleFileList(e.target.files); });
fiFiles.addEventListener('change', function(e) { handleFileList(e.target.files); });

function readEntries(entries) {
  var allFiles = [], pending = 0;
  function checkDone() { if (pending === 0) processFiles(allFiles); }
  function traverse(entry, path) {
    pending++;
    if (entry.isFile) {
      entry.file(function(f) { f._path = path + f.name; allFiles.push(f); pending--; checkDone(); });
    } else if (entry.isDirectory) {
      var reader = entry.createReader();
      (function readBatch() {
        reader.readEntries(function(results) {
          if (!results.length) { pending--; checkDone(); return; }
          for (var i = 0; i < results.length; i++) traverse(results[i], path + entry.name + '/');
          readBatch();
        });
      })();
    }
  }
  entries.forEach(function(e) { traverse(e, ''); });
}

function handleFileList(fileList) {
  var files = Array.from(fileList);
  files.forEach(function(f) { f._path = f.webkitRelativePath || f.name; });
  processFiles(files);
}

function processFiles(files) {
  statusEl.textContent = 'Processing ' + files.length + ' files\u2026';

  // First: check if any files are in vm-* directories (folder upload format)
  var groups = {}, ungrouped = [];
  files.forEach(function(f) {
    var path = f._path || f.name, parts = path.split('/'), modelDir = null;
    for (var i = 0; i < parts.length; i++) { if (parts[i].match(/^vm-/)) { modelDir = parts[i]; break; } }
    if (!modelDir) { ungrouped.push(f); return; }
    if (!groups[modelDir]) groups[modelDir] = [];
    groups[modelDir].push(f);
  });

  // If we found vm-* groups, use folder-based loading
  if (Object.keys(groups).length) {
    processFolderUpload(groups);
    return;
  }

  // Otherwise: treat each JSON file as a potential flat trajectory
  var jsonFiles = ungrouped.filter(function(f) { return (f.name || '').endsWith('.json'); });
  if (!jsonFiles.length) { statusEl.textContent = 'No valid JSON files found'; return; }

  var total = jsonFiles.length, loaded = 0;
  jsonFiles.forEach(function(f, idx) {
    readJSON(f).then(function(data) {
      if (!data) { loaded++; if (loaded === total) finishLoad(); return; }

      // Detect flat trajectory format: has "turns" array at root
      if (data.turns && Array.isArray(data.turns)) {
        var modelName = data.model || f.name.replace(/\.json$/i, '').replace(/\s*\(\d+\)\s*$/, '');
        // Avoid collisions if multiple files have same model name
        if (STATE.models[modelName]) modelName = modelName + '_' + (idx + 1);
        var m = { name: modelName, key: modelName, task: null, opencode: null };
        m.turns = data.turns;
        m.milestoneProgress = data.milestone_progress || [];
        // Build a synthetic task from metadata
        if (data.metadata && !STATE.task) {
          STATE.task = {
            task_title: data.metadata.title || data.task_id || '',
            task_id: data.task_id || ''
          };
        }
        m.metrics = computeMetrics(m);
        STATE.models[modelName] = m;
      }
      // Detect opencode format: has "messages" array
      else if (data.messages && Array.isArray(data.messages)) {
        var ocName = f.name.replace(/\.json$/i, '').replace(/\s*\(\d+\)\s*$/, '');
        if (STATE.models[ocName]) ocName = ocName + '_' + (idx + 1);
        STATE.models[ocName] = buildModel(ocName, { name: ocName, task: null, trajectory: null, opencode: data, milestoneProgressRaw: null });
      }
      // Detect wrapped trajectory: has "trajectory.turns" or is a task.json
      else if (data.trajectory && data.trajectory.turns) {
        var wrappedName = data.model || f.name.replace(/\.json$/i, '');
        if (STATE.models[wrappedName]) wrappedName = wrappedName + '_' + (idx + 1);
        STATE.models[wrappedName] = buildModel(wrappedName, { name: wrappedName, task: null, trajectory: data.trajectory, opencode: null, milestoneProgressRaw: null });
      }

      loaded++;
      statusEl.textContent = 'Loaded ' + loaded + '/' + total + ' files';
      if (loaded === total) finishLoad();
    });
  });
}

function processFolderUpload(groups) {
  var modelKeys = Object.keys(groups);
  var total = modelKeys.length, loaded = 0;
  modelKeys.forEach(function(mk) {
    var g = groups[mk];
    var model = { name: mk, task: null, trajectory: null, opencode: null, milestoneProgressRaw: null };
    var fileReads = [];
    g.forEach(function(f) {
      var fname = f.name || (f._path || '').split('/').pop();
      var subpath = (f._path || '').toLowerCase();
      if (fname === 'task.json') fileReads.push(readJSON(f).then(function(d) { model.task = d; }));
      else if (fname === 'opencode_export.json') fileReads.push(readJSON(f).then(function(d) { model.opencode = d; }));
      else if (subpath.indexOf('trajectory') !== -1 && fname.endsWith('.json')) fileReads.push(readJSON(f).then(function(d) { model.trajectory = d; }));
      else if (fname === 'milestone_progress.jsonl') fileReads.push(readText(f).then(function(t) { model.milestoneProgressRaw = t; }));
    });
    Promise.all(fileReads).then(function() {
      STATE.models[mk] = buildModel(mk, model);
      if (!STATE.task && model.task) STATE.task = model.task;
      loaded++;
      statusEl.textContent = 'Loaded ' + loaded + '/' + total + ' models';
      if (loaded === total) finishLoad();
    });
  });
}

function finishLoad() {
  STATE.modelOrder = Object.keys(STATE.models).sort();
  dz.classList.add('loaded');
  dz.querySelector('h2').textContent = STATE.modelOrder.length + ' model(s) loaded';
  statusEl.textContent = STATE.modelOrder.map(function(k) { return formatModelName(k); }).join(', ');
  launchBtn.classList.add('ready');
}
function launch() {
  if (!STATE.modelOrder.length) return;
  document.getElementById('loader').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initApp();
}
function readJSON(file) { return new Promise(function(res) { var r = new FileReader(); r.onload = function(e) { try { res(JSON.parse(e.target.result)); } catch(err) { res(null); } }; r.readAsText(file); }); }
function readText(file) { return new Promise(function(res) { var r = new FileReader(); r.onload = function(e) { res(e.target.result); }; r.readAsText(file); }); }

/* ═══════════════════════════════════════════════════════════
   DATA MODEL
   ═══════════════════════════════════════════════════════════ */
function buildModel(key, raw) {
  var m = { name: key, key: key, task: raw.task, opencode: raw.opencode };
  m.turns = [];
  if (raw.trajectory && raw.trajectory.turns) m.turns = raw.trajectory.turns;
  else if (raw.opencode) m.turns = opencodeToTurns(raw.opencode);
  m.milestoneProgress = [];
  if (raw.milestoneProgressRaw) m.milestoneProgress = parseMilestoneJSONL(raw.milestoneProgressRaw);
  else if (raw.task && raw.task.milestone_progress && raw.task.milestone_progress.length) m.milestoneProgress = raw.task.milestone_progress;
  m.metrics = computeMetrics(m);
  return m;
}

function opencodeToTurns(oc) {
  if (!oc || !oc.messages) return [];
  var turns = [], num = 0;
  oc.messages.forEach(function(msg) {
    var role = (msg.info && msg.info.role) || msg.role;
    if (role !== 'user' && role !== 'assistant') return;
    num++;
    var text = '';
    (msg.parts || []).forEach(function(p) { if (p.type === 'text' && p.text) text += p.text + '\n'; });
    turns.push({ turn_number: num, role: role, content: text.trim() });
  });
  return turns;
}

function parseMilestoneJSONL(text) {
  var lines = text.trim().split('\n'), map = {};
  lines.forEach(function(line) {
    try {
      var rec = JSON.parse(line), id = rec.milestone_id;
      if (!map[id]) map[id] = { milestone_id: id, status: 'not_started' };
      if (rec.status === 'in_progress' && !map[id].started_at_turn) { map[id].started_at_turn = rec.turn; map[id].status = 'in_progress'; }
      if (rec.status === 'completed') { map[id].completed_at_turn = rec.turn; map[id].status = 'completed'; if (map[id].started_at_turn) map[id].turn_count = rec.turn - map[id].started_at_turn; }
    } catch(e) {}
  });
  return Object.values(map);
}

/* ═══════════════════════════════════════════════════════════
   METRICS
   ═══════════════════════════════════════════════════════════ */
function computeMetrics(model) {
  var task = model.task || STATE.task;
  var milestones = task && task.user_intent ? (task.user_intent.milestones || []) : [];
  var guardrails = task && task.user_intent ? (task.user_intent.guardrails || {}) : {};
  var maxTurns = guardrails.max_turns || null;
  var totalTurns = model.turns.length;
  var userTurns = model.turns.filter(function(t) { return t.role === 'user'; }).length;
  var asstTurns = model.turns.filter(function(t) { return t.role === 'assistant'; }).length;

  var msTotal = milestones.length, msCompleted = 0, msDetails = [];
  var mp = model.milestoneProgress || [];
  milestones.forEach(function(ms) {
    var prog = null;
    mp.forEach(function(p) { if (p.milestone_id === ms.milestone_id) prog = p; });
    var status = prog ? prog.status : 'not_started';
    if (status === 'completed') msCompleted++;
    msDetails.push({ id: ms.milestone_id, prompt: ms.prompt || '', criteria: ms.continuation_criteria || '', interactions: ms.planned_interactions_list || [], status: status, turnCount: prog ? prog.turn_count : null, startTurn: prog ? prog.started_at_turn : null, endTurn: prog ? prog.completed_at_turn : null });
  });

  var userTexts = model.turns.filter(function(t) { return t.role === 'user'; }).map(function(t) { return contentToStr(t.content).toLowerCase(); });
  var allTexts = model.turns.map(function(t) { return contentToStr(t.content).toLowerCase(); });
  var intTotal = 0, intMatched = 0, intDetails = [];
  milestones.forEach(function(ms) {
    (ms.planned_interactions_list || []).forEach(function(intr) {
      intTotal++;
      var matched = matchInteraction(intr, userTexts, allTexts);
      if (matched) intMatched++;
      intDetails.push({ trigger: intr.trigger, reaction: intr.reaction, milestone: ms.milestone_id, matched: matched });
    });
  });

  // Tool call counts (from opencode data or inline markers)
  var totalTools = 0, toolCounts = {};
  if (model.opencode && model.opencode.messages) {
    model.opencode.messages.forEach(function(msg) {
      (msg.parts || []).forEach(function(p) {
        if (p.type === 'tool') {
          totalTools++;
          var tn = p.tool || 'other';
          toolCounts[tn] = (toolCounts[tn] || 0) + 1;
        }
      });
    });
  } else {
    // Count from inline [tool: name] markers in flat trajectory content
    model.turns.forEach(function(t) {
      if (t.role !== 'assistant') return;
      var c = contentToStr(t.content);
      var m;
      var re = /\[tool: (\w+)\]/g;
      while ((m = re.exec(c)) !== null) {
        totalTools++;
        var tn = m[1] || 'other';
        toolCounts[tn] = (toolCounts[tn] || 0) + 1;
      }
    });
  }

  var tokens = null;
  if (model.opencode && model.opencode.messages) {
    tokens = { input: 0, output: 0, total: 0 };
    model.opencode.messages.forEach(function(msg) {
      var tk = (msg.info && msg.info.tokens) || {};
      tokens.input += tk.input || 0; tokens.output += tk.output || 0; tokens.total += (tk.input || 0) + (tk.output || 0);
    });
  }

  return { totalTurns: totalTurns, userTurns: userTurns, asstTurns: asstTurns, maxTurns: maxTurns, exceedsMax: maxTurns && totalTurns > maxTurns, msTotal: msTotal, msCompleted: msCompleted, msDetails: msDetails, intTotal: intTotal, intMatched: intMatched, intDetails: intDetails, totalTools: totalTools, toolCounts: toolCounts, tokens: tokens };
}

function matchInteraction(intr, userTexts, allTexts) {
  var reaction = (intr.reaction || '').toLowerCase();
  var quotes = reaction.match(/"([^"]{4,})"/g) || [];
  for (var q = 0; q < quotes.length; q++) {
    var phrase = quotes[q].slice(1, -1);
    for (var i = 0; i < userTexts.length; i++) if (userTexts[i].indexOf(phrase) !== -1) return true;
    for (var j = 0; j < allTexts.length; j++) if (allTexts[j].indexOf(phrase) !== -1) return true;
  }
  var words = reaction.replace(/"[^"]*"/g, '').split(/\s+/).filter(function(w) { return w.length > 4 && 'about after again being could doing every first going their there these those through would should'.indexOf(w) === -1; });
  if (words.length >= 4) {
    for (var k = 0; k < userTexts.length; k++) {
      var hits = 0; words.forEach(function(w) { if (userTexts[k].indexOf(w) !== -1) hits++; });
      if (hits / words.length >= 0.5) return true;
    }
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════
   TOPBAR
   ═══════════════════════════════════════════════════════════ */
function initApp() {
  loadSaved();
  renderTopbar();
  switchTab(STATE.modelOrder.length > 1 ? 'compare' : STATE.modelOrder[0]);
}

function renderTopbar() {
  var task = STATE.task, html = '';
  if (task) {
    var g = (task.user_intent && task.user_intent.guardrails) || {};
    var anyExceeds = STATE.modelOrder.some(function(mk) { return STATE.models[mk].metrics.exceedsMax; });
    html += '<div class="task-title">';
    html += '<span class="tt-name">' + esc(task.task_title || '') + '</span>';
    if (task.language) html += '<span class="tt-badge tt-lang">' + esc(task.language) + '</span>';
    if (task.difficulty) {
      var dl = (task.difficulty || '').toLowerCase();
      var dc = dl === 'easy' ? 'tt-easy' : dl === 'medium' ? 'tt-med' : 'tt-hard';
      html += '<span class="tt-badge ' + dc + '">' + esc(task.difficulty) + '</span>';
    }
    if (g.max_turns) html += '<span class="tt-badge tt-turns' + (anyExceeds ? ' warn' : '') + '">Max ' + g.max_turns + ' turns</span>';
    html += '</div>';
  }
  html += '<div class="tabs">';
  if (STATE.modelOrder.length > 1) html += '<div class="tab overview-tab' + (STATE.activeTab === 'compare' ? ' active' : '') + '" onclick="switchTab(\'compare\')">Overview</div>';
  if (STATE.modelOrder.length >= 2) html += '<div class="tab sbs-tab' + (STATE.activeTab === 'sbs' ? ' active' : '') + '" onclick="switchTab(\'sbs\')" style="color:var(--cyan)">A | B</div>';
  STATE.modelOrder.forEach(function(mk) {
    var m = STATE.models[mk].metrics;
    html += '<div class="tab' + (STATE.activeTab === mk ? ' active' : '') + '" data-model="' + mk + '" onclick="switchTab(\'' + mk + '\')">';
    html += '<span class="t-status ' + (m.exceedsMax ? 't-warn' : 't-ok') + '"></span>' + esc(formatModelName(mk)) + '</div>';
  });
  html += '</div>';
  html += '<div class="actions">';
  if (STATE.activeTab === 'sbs') {
    html += '<button class="act-btn" onclick="toggleAllTurnsSide(\'a-\')">Collapse A</button>';
    html += '<button class="act-btn" onclick="toggleAllTurnsSide(\'b-\')">Collapse B</button>';
  }
  html += '<button class="act-btn" id="collapse-btn" onclick="toggleAllTurns()">Collapse all</button>';
  html += '</div>';
  document.getElementById('topbar').innerHTML = html;
}

function switchTab(tabId) {
  STATE.activeTab = tabId; STATE.allCollapsed = false;
  renderTopbar();
  var cv = document.getElementById('compare-view'), mv = document.getElementById('model-view'), sv = document.getElementById('sbs-view');
  cv.style.display = 'none'; mv.style.display = 'none'; sv.classList.remove('active');
  var active = null;
  if (tabId === 'compare') {
    cv.style.display = 'block'; active = cv;
    renderOverviewView();
  } else if (tabId === 'sbs') {
    sv.classList.add('active'); active = sv;
    renderSbsView();
  } else {
    mv.style.display = 'flex'; active = mv;
    renderModelView(tabId);
  }
  if (active) {
    active.classList.remove('view-enter');
    void active.offsetWidth;
    active.classList.add('view-enter');
  }
}

/* ═══════════════════════════════════════════════════════════
   OVERVIEW VIEW
   ═══════════════════════════════════════════════════════════ */
function renderOverviewView() {
  var el = document.getElementById('compare-view');
  var task = STATE.task, html = '<div class="fade-in">';

  if (task) {
    var g = (task.user_intent && task.user_intent.guardrails) || {};
    var anyExceeds = STATE.modelOrder.some(function(mk) { return STATE.models[mk].metrics.exceedsMax; });
    html += '<div class="cv-task-header glass">';
    if (task.task_title) html += '<h2 class="cv-task-name">' + esc(task.task_title) + '</h2>';
    var tags = '';
    if (task.language) tags += '<span class="tt-badge tt-lang">' + esc(task.language) + '</span>';
    if (task.difficulty) {
      var dl = (task.difficulty || '').toLowerCase();
      var dc = dl === 'easy' ? 'tt-easy' : dl === 'medium' ? 'tt-med' : 'tt-hard';
      tags += '<span class="tt-badge ' + dc + '">' + esc(task.difficulty) + '</span>';
    }
    if (g.max_turns) tags += '<span class="tt-badge tt-turns' + (anyExceeds ? ' warn' : '') + '">Max ' + g.max_turns + ' turns</span>';

      html += '<details class="cv-problem-inner" open><summary>Problem Statement</summary>';
      html += '<div class="cv-problem-text">' + esc(task.problem_statement) + '</div></details>';
    }
    html += '</div>';
  }

  // Metric cards
  html += '<div class="metric-grid">';
  STATE.modelOrder.forEach(function(mk) { html += renderMetricCard(mk); });
  html += '</div>';

  // Milestone completion table
  var msKeys = getMilestoneIds();
  if (msKeys.length) {
    html += '<div class="cv-table-wrap glass">';
    html += '<h3>Milestones</h3>';
    html += '<table class="cv-table"><thead><tr><th></th>';
    STATE.modelOrder.forEach(function(mk) { html += '<th>' + esc(formatModelName(mk)) + '</th>'; });
    html += '</tr></thead><tbody>';
    msKeys.forEach(function(msId) {
      html += '<tr><td>' + esc(msId.toUpperCase()) + '</td>';
      STATE.modelOrder.forEach(function(mk) {
        var detail = findMsDetail(mk, msId);
        var cell = '';
        if (detail && detail.status === 'completed') cell = '<span class="cell-pass">&#10003;</span><span class="cell-turns">' + (detail.turnCount != null ? detail.turnCount + ' turns' : '') + '</span>';
        else if (detail && detail.status === 'in_progress') cell = '<span class="cell-wip">in progress</span>';
        else cell = '<span class="cell-fail">&#10007;</span>';
        html += '<td>' + cell + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  html += '</div>';
  el.innerHTML = html;

function renderMetricCard(mk) {
  var m = STATE.models[mk].metrics;
  var colors = ['#6366f1','#3b82f6','#06b6d4','#8b5cf6','#ec4899'];
  var dotColor = colors[STATE.modelOrder.indexOf(mk) % colors.length];
  var msPct = m.msTotal ? Math.round(m.msCompleted / m.msTotal * 100) : 0;
  var turnPct = m.maxTurns ? Math.min(Math.round(m.totalTurns / m.maxTurns * 100), 100) : 0;

  var html = '<div class="metric-card glass" onclick="switchTab(\'' + mk + '\')">';
  html += '<div class="mc-name"><span class="mc-dot" style="background:' + dotColor + '"></span>' + esc(formatModelName(mk)) + '</div>';
  if (m.msTotal) {
    html += '<div class="mc-row"><span class="mc-label">Milestones</span><span class="mc-value" style="color:var(--green)">' + m.msCompleted + ' / ' + m.msTotal + '</span></div>';
    html += '<div class="progress-track"><div class="progress-fill pf-green" style="width:' + msPct + '%"></div></div>';
  }
  html += '<div class="mc-row"><span class="mc-label">Turns</span><span class="mc-value' + (m.exceedsMax ? '" style="color:var(--red)' : '') + '">' + m.totalTurns + (m.maxTurns ? ' / ' + m.maxTurns : '') + '</span></div>';
  if (m.maxTurns) html += '<div class="progress-track"><div class="progress-fill ' + (m.exceedsMax ? 'pf-red' : 'pf-blue') + '" style="width:' + turnPct + '%"></div></div>';
  if (m.totalTools) {
    html += '<div class="mc-row"><span class="mc-label">Tool calls</span><span class="mc-value">' + m.totalTools + '</span></div>';
    var topTools = Object.entries(m.toolCounts).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 4);
    html += '<div class="mc-tools">' + topTools.map(function(t) { return '<span class="mc-tool-tag tb-' + t[0] + '">' + (LABELS[t[0]] || t[0]) + ' ' + t[1] + '</span>'; }).join('') + '</div>';
  }
  if (m.intTotal) {
    var intPct = Math.round(m.intMatched / m.intTotal * 100);
    html += '<div class="mc-row"><span class="mc-label">Planned Interactions</span><span class="mc-value" style="color:' + (intPct >= 75 ? 'var(--green)' : intPct >= 50 ? 'var(--amber)' : 'var(--red)') + '">' + m.intMatched + ' / ' + m.intTotal + '</span></div>';
    html += '<div class="progress-track"><div class="progress-fill ' + (intPct >= 75 ? 'pf-green' : intPct >= 50 ? 'pf-amber' : 'pf-red') + '" style="width:' + intPct + '%"></div></div>';
  }
  html += '</div>';
  return html;
}

/* ═══════════════════════════════════════════════════════════
   MODEL VIEW
   ═══════════════════════════════════════════════════════════ */
function renderModelView(mk) {
  var model = STATE.models[mk];
  if (!model) return;
  renderConversation(model);
  renderSidebar(model);
}

function renderConversation(model) {
  var el = document.getElementById('convo');
  if (model.opencode && model.opencode.messages) renderConvoOpencode(el, model);
  else renderConvoSimple(el, model);
}

function buildGroups(model) {
  if (model.opencode && model.opencode.messages) {
    var msgs = model.opencode.messages, groups = [], cur = null;
    msgs.forEach(function(m) {
      var role = (m.info && m.info.role) || m.role;
      if (role !== 'user' && role !== 'assistant') return;
      var nm = { role: role, parts: m.parts || [], raw: m };
      if (role === 'user') { if (cur) groups.push(cur); cur = { user: nm, assistants: [], format: 'opencode' }; }
      else { if (!cur) cur = { user: null, assistants: [], format: 'opencode' }; cur.assistants.push(nm); }
    });
    if (cur) groups.push(cur);
    return groups;
  }
  var turns = model.turns || [], groups2 = [], cur2 = null;
  turns.forEach(function(t) {
    if (t.role === 'user') { if (cur2) groups2.push(cur2); cur2 = { user: t, assistants: [], format: 'simple' }; }
    else if (t.role === 'assistant') { if (!cur2) cur2 = { user: null, assistants: [], format: 'simple' }; cur2.assistants.push(t); }
  });
  if (cur2) groups2.push(cur2);
  return groups2;
}

function groupUserText(g) {
  if (!g.user) return '';
  if (g.format === 'opencode') {
    var t = '';
    (g.user.parts || []).forEach(function(p) { if (p.type === 'text' && p.text) t += p.text + '\n'; });
    return t.trim();
  }
  return (contentToStr(g.user.content) || '').trim();
}

function renderGroupBody(g, ctx) {
  var html = '';
  var ut = groupUserText(g);
  if (g.user && ut) html += '<div class="msg-user"><div class="msg-user-label">User</div><div class="msg-user-text">' + esc(ut) + '</div></div>';
  if (g.format === 'opencode') {
    g.assistants.forEach(function(msg) {
      html += '<div class="msg-asst">';
      var hasContent = false;
      (msg.parts || []).forEach(function(p) {
        if (p.type === 'step-start') { ctx.stepNum++; html += '<div class="step-header">Step ' + ctx.stepNum + '</div>'; }
        else if (p.type === 'text' && p.text && p.text.trim()) { hasContent = true; html += '<div class="asst-text">' + esc(p.text.trim()) + '</div>'; }
        else if (p.type === 'tool') { hasContent = true; html += renderToolBlock(p); }
      });
      if (!hasContent) html += '<div class="empty-resp">(no visible content)</div>';
      html += '</div>';
    });
  } else {
    g.assistants.forEach(function(a) {
      var c = contentToStr(a.content);
      if (c && c.indexOf('[tool:') !== -1) {
        html += '<div class="msg-asst">' + renderInlineParts(parseInlineTools(c)) + '</div>';
      } else {
        html += '<div class="msg-asst"><div class="asst-text">' + esc(c || '(no response)') + '</div></div>';
      }
    });
  }
  return html;
}

function renderGroup(g, idx, model, opts) {
  opts = opts || {};
  var prefix = opts.idPrefix || '';
  var key = prefix + idx;
  var msMap = opts.msMap || {};
  var userText = groupUserText(g) || '(no user prompt)';
  var msId = msMap[idx];
  var isSaved = STATE.savedTurns.some(function(s) { return s.modelKey === model.key && s.promptIdx === idx; });
  var openInit = opts.openInit !== false;

  var html = '<div class="turn-group' + (msId ? ' ms-start' : '') + '" id="prompt-' + key + '">';
  html += '<div class="turn-header" onclick="toggleTurn(\'' + key + '\')">';
  html += '<span class="arrow' + (openInit ? ' open' : '') + '" id="tarr_' + key + '">&#9654;</span>';
  html += '<span class="turn-num">Prompt ' + (idx + 1) + '</span>';
  if (msId) html += '<span class="ms-badge">' + msId.toUpperCase() + '</span>';
  html += '<span style="flex:1"></span>';
  if (!opts.hideSaveBtn) {
    html += '<button class="save-turn-btn' + (isSaved ? ' saved' : '') + '" onclick="event.stopPropagation();toggleSaveTurn(\'' + esc(model.key) + '\',' + idx + ',\'' + esc(userText.slice(0, 80).replace(/'/g, '')) + '\')" title="' + (isSaved ? 'Unsave' : 'Save for review') + '">&#9733;</button>';
  }
  html += '</div>';
  html += '<div class="turn-body' + (openInit ? ' open' : '') + '" id="tbody_' + key + '">';
  html += renderGroupBody(g, opts.ctx || { stepNum: 0 });
  html += '</div></div>';
  return html;
}

function renderConvoSimple(el, model) {
  var groups = buildGroups(model);
  if (!groups.length) { el.innerHTML = '<div style="padding:40px;color:var(--text-dim);text-align:center">No trajectory data</div>'; return; }
  var msMap = buildMsPromptMap(model), html = '', ctx = { stepNum: 0 };
  groups.forEach(function(g, idx) { html += renderGroup(g, idx, model, { msMap: msMap, ctx: ctx }); });
  el.innerHTML = html;
}

function renderConvoOpencode(el, model) {
  var groups = buildGroups(model);
  if (!groups.length) { el.innerHTML = '<div style="padding:40px;color:var(--text-dim);text-align:center">No messages</div>'; return; }
  var msMap = buildMsPromptMap(model), html = '', ctx = { stepNum: 0 };
  groups.forEach(function(g, idx) { html += renderGroup(g, idx, model, { msMap: msMap, ctx: ctx }); });
  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════
   INLINE TOOL PARSER (flat trajectory format)
   ═══════════════════════════════════════════════════════════ */
function parseInlineTools(content) {
  if (!content || content.indexOf('[tool:') === -1) {
    return content ? [{ type: 'text', content: content }] : [];
  }
  var segments = content.split(/(?=\[tool: )/);
  var parts = [];
  segments.forEach(function(seg) {
    seg = seg.trim();
    if (!seg) return;
    if (seg.indexOf('[tool: ') !== 0) {
      if (seg) parts.push({ type: 'text', content: seg });
      return;
    }
    var firstNL = seg.indexOf('\n');
    var firstLine = firstNL >= 0 ? seg.slice(0, firstNL) : seg;
    var body = firstNL >= 0 ? seg.slice(firstNL + 1) : '';
    var nameMatch = firstLine.match(/^\[tool: (\w+)\]\s*(.*)/);
    if (!nameMatch) { parts.push({ type: 'text', content: seg }); return; }
    var toolName = nameMatch[1];
    var titleText = nameMatch[2].trim();
    var output = '', oldStr = '', newStr = '';

    // Extract [output]
    var outIdx = body.indexOf('[output] ');
    if (outIdx !== -1) {
      output = body.slice(outIdx + 9).trim();
      var beforeOut = body.slice(0, outIdx).trim();
      if (beforeOut && !titleText) titleText = beforeOut.split('\n')[0];
    }
    // Extract [answer] (question tool)
    var ansIdx = body.indexOf('[answer] ');
    if (ansIdx !== -1) {
      output = body.slice(ansIdx + 9).trim();
    }
    // For edit tools, extract old/new
    if ((toolName === 'edit' || toolName === 'apply_patch') && body.indexOf('  old: ') !== -1) {
      var oldMatch = body.match(/\s+old: ([\s\S]*?)(?=\n\s*new: )/);
      var newMatch = body.match(/\s+new: ([\s\S]*?)$/);
      if (oldMatch) oldStr = oldMatch[1].trim();
      if (newMatch) newStr = newMatch[1].trim();
    }
    parts.push({ type: 'tool', tool: toolName, title: titleText, output: output, oldStr: oldStr, newStr: newStr });
  });
  return parts;
}

function renderInlineParts(parts) {
  var html = '';
  parts.forEach(function(p) {
    if (p.type === 'text') {
      html += '<div class="asst-text">' + esc(p.content) + '</div>';
    } else {
      html += renderInlineTool(p);
    }
  });
  return html;
}

function toolSummary(tn, fields) {
  if (tn === 'bash') return (fields.cmd || '').replace(/\s+/g, ' ').slice(0, 90);
  if (tn === 'read') return (fields.file || '').split('/').pop() || '';
  if (tn === 'edit' || tn === 'apply_patch') {
    var f = (fields.file || '').split('/').pop() || '';
    var counts = '';
    if (fields.oldStr || fields.newStr) {
      var del = fields.oldStr ? fields.oldStr.split('\n').length : 0;
      var add = fields.newStr ? fields.newStr.split('\n').length : 0;
      counts = ' +' + add + ' -' + del;
    }
    return f + counts;
  }
  if (tn === 'write') return ((fields.file || '').split('/').pop() || '');
  if (tn === 'grep') return 'pattern: ' + (fields.pattern || '').slice(0, 60);
  if (tn === 'glob') return (fields.pattern || '').slice(0, 60);
  if (tn === 'question') {
    var qs = fields.questions || [];
    if (qs.length) return (qs[0].header || qs[0].question || '').slice(0, 80);
    return (fields.title || '').slice(0, 80);
  }
  if (tn === 'todowrite') {
    var n = (fields.todos || []).length;
    return n ? (n + ' todo' + (n !== 1 ? 's' : '')) : (fields.title || '');
  }
  return (fields.title || '').slice(0, 90);
}

var TOOL_DATA_CACHE = {};
function escAttr(s) { return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function renderCodeBlock(text, lineLimit) {
  if (!text) return '';
  var s = String(text);
  var lines = s.split('\n');
  if (!lineLimit) lineLimit = 40;
  var id = 'tc_' + Math.random().toString(36).slice(2, 8);
  TOOL_DATA_CACHE[id] = s;
  if (lines.length <= lineLimit) {
    return '<pre class="codeblock">' + esc(s) + '</pre>';
  }
  var shown = lines.slice(0, lineLimit).join('\n');
  var hidden = lines.length - lineLimit;
  return '<pre class="codeblock" id="' + id + '">' + esc(shown) + '\n…</pre>' +
    '<button class="tool-truncate-btn" onclick="expandTool(\'' + id + '\')">Show ' + hidden + ' more lines</button>';
}
function expandTool(id) {
  var full = TOOL_DATA_CACHE[id];
  var el = document.getElementById(id);
  if (!el || full == null) return;
  el.textContent = full;
  if (el.nextElementSibling && el.nextElementSibling.classList.contains('tool-truncate-btn')) {
    el.nextElementSibling.remove();
  }
}
function renderDiffBlock(oldStr, newStr) {
  var html = '<div class="diff">';
  if (oldStr) oldStr.split('\n').forEach(function(l) { html += '<span class="del">- ' + esc(l) + '</span>'; });
  if (newStr) newStr.split('\n').forEach(function(l) { html += '<span class="add">+ ' + esc(l) + '</span>'; });
  html += '</div>';
  return html;
}
function renderToolHeader(id, tn, summary, dur, copyText) {
  var html = '<div class="tool-header" onclick="toggleTool(\'' + id + '\')">';
  html += '<span class="arrow" id="arr_' + id + '">&#9654;</span>';
  html += '<span class="tool-badge tb-' + tn + '">' + (LABELS[tn] || tn) + '</span>';
  html += '<span class="tool-summary">' + esc(summary || tn) + '</span>';
  if (dur) html += '<span class="tool-dur">' + dur + '</span>';
  if (copyText != null) {
    var cid = 'tcopy_' + Math.random().toString(36).slice(2, 8);
    TOOL_DATA_CACHE[cid] = copyText;
    html += '<button class="tool-copy" onclick="event.stopPropagation();copyTool(\'' + cid + '\',this)">copy</button>';
  }
  html += '</div>';
  return html;
}
function copyTool(id, btn) {
  var s = TOOL_DATA_CACHE[id];
  if (s == null) return;
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(function() {
    var old = btn.textContent; btn.textContent = 'copied'; setTimeout(function() { btn.textContent = old; }, 1200);
  });
}

function renderInlineTool(p) {
  var tn = p.tool;
  var id = 't_' + Math.random().toString(36).slice(2, 8);
  var summary = toolSummary(tn, { cmd: p.title, file: p.title, oldStr: p.oldStr, newStr: p.newStr, title: p.title });
  var copyText = '';
  if (tn === 'bash') copyText = p.title || '';
  else if (tn === 'edit' || tn === 'apply_patch') copyText = (p.newStr || p.title || '');
  else copyText = p.output || p.title || '';

  var html = '<div class="tool-block tbl-' + tn + '">';
  html += renderToolHeader(id, tn, summary, '', copyText);
  html += '<div class="tool-body" id="' + id + '">';

  if (tn === 'edit' || tn === 'apply_patch') {
    if (p.title) html += '<div class="tool-meta-line">' + esc(p.title) + '</div>';
    if (p.oldStr || p.newStr) html += renderDiffBlock(p.oldStr, p.newStr);
  } else if (tn === 'bash') {
    if (p.title) html += '<pre class="codeblock"><span class="cmd">$ ' + esc(p.title) + '</span></pre>';
    if (p.output) html += renderCodeBlock(p.output);
  } else if (tn === 'read') {
    if (p.title) html += '<div class="tool-meta-line">' + esc(p.title) + '</div>';
    if (p.output) html += renderCodeBlock(p.output);
  } else if (tn === 'write') {
    if (p.title) html += '<div class="tool-meta-line">' + esc(p.title) + '</div>';
  } else if (tn === 'todowrite') {
    var parsed = false;
    if (p.output) {
      try {
        var todos = JSON.parse(p.output);
        if (Array.isArray(todos)) {
          parsed = true;
          html += '<div class="todo-list">';
          todos.forEach(function(t) {
            var s = (t.status || 'pending').replace(/\s+/g, '_');
            var icon = s === 'completed' ? '&#10003;' : s === 'in_progress' ? '&#9679;' : '';
            html += '<div class="todo-item td-' + s + '">';
            html += '<div class="todo-check">' + icon + '</div>';
            html += '<div class="todo-content">' + esc(t.content || '') + '</div>';
            if (t.priority) html += '<span class="todo-priority tp-' + (t.priority || 'medium') + '">' + esc(t.priority) + '</span>';
            html += '</div>';
          });
          html += '</div>';
        }
      } catch(e) {}
    }
    if (!parsed && p.output) html += renderCodeBlock(p.output);
  } else if (tn === 'question') {
    html += '<div class="ask-block"><div class="ask-text">' + esc(p.title || '') + '</div>';
    if (p.output) html += '<div style="margin-top:6px;font-size:11px;color:var(--text-sec)">' + esc(p.output) + '</div>';
    html += '</div>';
  } else {
    if (p.title) html += '<div class="tool-meta-line">' + esc(p.title) + '</div>';
    if (p.output) html += renderCodeBlock(p.output);
  }
  html += '</div></div>';
  return html;
}

/* ═══════════════════════════════════════════════════════════
   TOOL BLOCKS (opencode structured format)
   ═══════════════════════════════════════════════════════════ */
function renderToolBlock(p) {
  var tn = p.tool || 'tool', st = p.state || {}, inp = st.input || {}, out = st.output || '', meta = st.metadata || {}, time = st.time || {};
  var dur = time.start && time.end ? ((time.end - time.start) / 1000).toFixed(1) + 's' : '';
  var id = 't_' + Math.random().toString(36).slice(2, 8);

  var cmd = inp.command || inp.description || '';
  var file = inp.filePath || inp.file_path || inp.path || '';
  var oldStr = inp.oldString || inp.old_string || '';
  var newStr = inp.newString || inp.new_string || '';
  var summary = toolSummary(tn, { cmd: cmd, file: file, oldStr: oldStr, newStr: newStr, pattern: inp.pattern || inp.glob_pattern || '', questions: inp.questions || [], todos: inp.todos || [], title: st.title || toolLabel(tn, inp) });
  var copyText = '';
  if (tn === 'bash') copyText = cmd;
  else if (tn === 'edit' || tn === 'apply_patch') copyText = newStr || oldStr || '';
  else copyText = out || '';

  var html = '<div class="tool-block tbl-' + tn + '">';
  html += renderToolHeader(id, tn, summary, dur, copyText);
  html += '<div class="tool-body" id="' + id + '">';

  if (tn === 'edit' || tn === 'apply_patch') {
    if (file) html += '<div class="tool-meta-line">' + esc(file) + '</div>';
    if (oldStr || newStr) html += renderDiffBlock(oldStr, newStr);
    else if (out) html += renderCodeBlock(out);
  } else if (tn === 'bash') {
    if (cmd) html += '<pre class="codeblock"><span class="cmd">$ ' + esc(cmd) + '</span></pre>';
    if (out) html += renderCodeBlock(out);
    if (meta.exit !== undefined) html += '<div style="color:' + (meta.exit === 0 ? 'var(--green)' : 'var(--red)') + ';font-size:11px;margin-top:4px">exit ' + meta.exit + '</div>';
  } else if (tn === 'read') {
    if (file) html += '<div class="tool-meta-line">' + esc(file) + '</div>';
    if (out) html += renderCodeBlock(out);
  } else if (tn === 'grep') {
    html += '<div class="tool-meta-line">pattern: <b style="color:var(--purple)">' + esc(inp.pattern || '') + '</b></div>';
    if (out) html += renderCodeBlock(out);
  } else if (tn === 'question') {
    html += '<div class="ask-block">';
    (inp.questions || []).forEach(function(q) {
      html += '<div class="ask-q">';
      if (q.header) html += '<div class="ask-label">' + esc(q.header) + '</div>';
      html += '<div class="ask-text">' + esc(q.question || '') + '</div>';
      if (q.options && q.options.length) {
        html += '<div class="ask-opts">';
        q.options.forEach(function(o) {
          html += '<div class="ask-opt">' + esc(o.label || '');
          if (o.description) html += ' <span class="ask-opt-desc">&mdash; ' + esc(o.description) + '</span>';
          html += '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else if (tn === 'todowrite') {
    var todos = inp.todos || [];
    if (!todos.length && out) { try { todos = JSON.parse(out); } catch(e) {} }
    html += '<div class="todo-list">';
    todos.forEach(function(t) {
      var s = (t.status || 'pending').replace(/\s+/g, '_');
      var icon = s === 'completed' ? '&#10003;' : s === 'in_progress' ? '&#9679;' : '';
      html += '<div class="todo-item td-' + s + '">';
      html += '<div class="todo-check">' + icon + '</div>';
      html += '<div class="todo-content">' + esc(t.content || '') + '</div>';
      if (t.priority) html += '<span class="todo-priority tp-' + (t.priority || 'medium') + '">' + esc(t.priority) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    var is = JSON.stringify(inp, null, 2);
    if (is && is !== '{}') html += '<pre class="codeblock">' + esc(is) + '</pre>';
    if (out) html += renderCodeBlock(out);
  }
  html += '</div></div>';
  return html;
}

function toggleSaveTurn(modelKey, promptIdx, preview) {
  var existing = STATE.savedTurns.findIndex(function(s) { return s.modelKey === modelKey && s.promptIdx === promptIdx; });
  if (existing >= 0) {
    STATE.savedTurns.splice(existing, 1);
    toast('Unsaved');
  } else {
    var note = prompt('Add a note (optional):') || '';
    STATE.savedTurns.push({ modelKey: modelKey, promptIdx: promptIdx, preview: preview, note: note });
    toast('Saved for review');
  }
  persistSaved();
  var btn = document.querySelector('#prompt-' + promptIdx + ' .save-turn-btn');
  if (btn) {
    var isSaved = existing < 0;
    btn.classList.toggle('saved', isSaved);
    btn.title = isSaved ? 'Unsave' : 'Save for review';
  }
  renderSavedPane();
}

function removeSavedTurn(index) {
  STATE.savedTurns.splice(index, 1);
  persistSaved();
  renderSavedPane();
  if (STATE.activeTab !== 'compare') renderConversation(STATE.models[STATE.activeTab]);
}

function clearAllSaved() {
  STATE.savedTurns = [];
  persistSaved();
  renderSavedPane();
  if (STATE.activeTab !== 'compare') renderConversation(STATE.models[STATE.activeTab]);
}

function goToSavedTurn(index) {
  var s = STATE.savedTurns[index];
  if (!s) return;
  switchTab(s.modelKey);
  setTimeout(function() { jumpToPrompt(s.promptIdx); }, 100);
}

function persistSaved() {
  var taskId = STATE.task && STATE.task.id ? STATE.task.id : (STATE.task && STATE.task.task_title ? STATE.task.task_title : 'default');
  try { localStorage.setItem('savedTurns_' + taskId, JSON.stringify(STATE.savedTurns)); } catch(e) {}
}

function loadSaved() {
  var taskId = STATE.task && STATE.task.id ? STATE.task.id : (STATE.task && STATE.task.task_title ? STATE.task.task_title : 'default');
  try {
    var raw = localStorage.getItem('savedTurns_' + taskId);
    if (raw) STATE.savedTurns = JSON.parse(raw);
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════
   SIDE-BY-SIDE VIEW
   ═══════════════════════════════════════════════════════════ */
function normalizePrompt(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function promptMatchScore(a, b) {
  var na = normalizePrompt(a), nb = normalizePrompt(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  var sigA = na.slice(0, 120), sigB = nb.slice(0, 120);
  if (na.indexOf(sigB) !== -1 || nb.indexOf(sigA) !== -1) return 0.95;
  var wordsA = na.split(' ').filter(function(w) { return w.length > 3; });
  var wordsB = nb.split(' ').filter(function(w) { return w.length > 3; });
  if (!wordsA.length || !wordsB.length) return 0;
  var setB = {}; wordsB.forEach(function(w) { setB[w] = true; });
  var hits = 0;
  wordsA.forEach(function(w) { if (setB[w]) hits++; });
  var denom = Math.max(wordsA.length, wordsB.length);
  return hits / denom;
}

function computeSbsAnchors(groupsA, groupsB) {
  var anchors = [], runs = [];
  var lastA = -1, lastB = -1;
  for (var i = 0; i < groupsA.length; i++) {
    var aText = groupUserText(groupsA[i]);
    if (!aText) continue;
    var bestJ = -1, bestScore = 0;
    var startJ = Math.max(lastB + 1, 0);
    var endJ = Math.min(groupsB.length, startJ + 8);
    for (var j = startJ; j < endJ; j++) {
      var bText = groupUserText(groupsB[j]);
      if (!bText) continue;
      var score = promptMatchScore(aText, bText);
      if (score > bestScore) { bestScore = score; bestJ = j; }
    }
    if (bestJ >= 0 && bestScore >= 0.6) {
      runs.push({ aStart: lastA + 1, aEnd: i, bStart: lastB + 1, bEnd: bestJ });
      anchors.push({ aIdx: i, bIdx: bestJ, score: bestScore });
      lastA = i; lastB = bestJ;
    }
  }
  runs.push({ aStart: lastA + 1, aEnd: groupsA.length, bStart: lastB + 1, bEnd: groupsB.length });
  return { anchors: anchors, runs: runs };
}

function collectGroupTools(g) {
  var tools = [];
  if (g.format === 'opencode') {
    g.assistants.forEach(function(msg) {
      (msg.parts || []).forEach(function(p) {
        if (p.type === 'tool') {
          var st = p.state || {}, inp = st.input || {};
          tools.push({
            name: p.tool || 'tool',
            file: inp.filePath || inp.file_path || inp.path || ''
          });
        }
      });
    });
  } else {
    g.assistants.forEach(function(a) {
      var c = contentToStr(a.content);
      if (!c || c.indexOf('[tool:') === -1) return;
      var parts = parseInlineTools(c);
      parts.forEach(function(p) {
        if (p.type === 'tool') tools.push({ name: p.tool, file: '' });
      });
    });
  }
  return tools;
}

function groupAssistantTextLen(g) {
  var n = 0;
  if (g.format === 'opencode') {
    g.assistants.forEach(function(msg) {
      (msg.parts || []).forEach(function(p) { if (p.type === 'text' && p.text) n += p.text.length; });
    });
  } else {
    g.assistants.forEach(function(a) { n += (contentToStr(a.content) || '').length; });
  }
  return n;
}

function computeRunDiff(runGroupsA, runGroupsB) {
  var toolsA = [], toolsB = [], lenA = 0, lenB = 0, filesA = {}, filesB = {};
  runGroupsA.forEach(function(g) {
    collectGroupTools(g).forEach(function(t) { toolsA.push(t.name); if (t.file) filesA[t.file] = true; });
    lenA += groupAssistantTextLen(g);
  });
  runGroupsB.forEach(function(g) {
    collectGroupTools(g).forEach(function(t) { toolsB.push(t.name); if (t.file) filesB[t.file] = true; });
    lenB += groupAssistantTextLen(g);
  });
  var bagA = {}, bagB = {};
  toolsA.forEach(function(n) { bagA[n] = (bagA[n] || 0) + 1; });
  toolsB.forEach(function(n) { bagB[n] = (bagB[n] || 0) + 1; });
  var keys = {};
  Object.keys(bagA).forEach(function(k) { keys[k] = true; });
  Object.keys(bagB).forEach(function(k) { keys[k] = true; });
  var toolsDiffer = false;
  Object.keys(keys).forEach(function(k) { if ((bagA[k] || 0) !== (bagB[k] || 0)) toolsDiffer = true; });
  var fileKeys = {};
  Object.keys(filesA).forEach(function(k) { fileKeys[k] = true; });
  Object.keys(filesB).forEach(function(k) { fileKeys[k] = true; });
  var fileDiffCount = 0;
  Object.keys(fileKeys).forEach(function(k) { if (!filesA[k] || !filesB[k]) fileDiffCount++; });
  var lengthSkew = false;
  if (lenA > 0 && lenB > 0) {
    var ratio = lenA / lenB;
    if (ratio > 2 || ratio < 0.5) lengthSkew = true;
  } else if ((lenA > 200) !== (lenB > 200)) {
    lengthSkew = true;
  }
  return { toolsDiffer: toolsDiffer, fileDiffCount: fileDiffCount, lengthSkew: lengthSkew, lenA: lenA, lenB: lenB };
}

function renderSbsView() {
  var sv = document.getElementById('sbs-view');
  if (!STATE.sbsPair.a || !STATE.models[STATE.sbsPair.a]) STATE.sbsPair.a = STATE.modelOrder[0] || null;
  if (!STATE.sbsPair.b || !STATE.models[STATE.sbsPair.b]) {
    STATE.sbsPair.b = STATE.modelOrder.find(function(k) { return k !== STATE.sbsPair.a; }) || STATE.modelOrder[1] || null;
  }
  var aKey = STATE.sbsPair.a, bKey = STATE.sbsPair.b;
  var pickHtml = '<div class="sbs-pickbar">';
  pickHtml += '<span class="sbs-side-label a">A</span><select onchange="setSbsPair(\'a\', this.value)">';
  STATE.modelOrder.forEach(function(mk) { pickHtml += '<option value="' + esc(mk) + '"' + (mk === aKey ? ' selected' : '') + '>' + esc(formatModelName(mk)) + '</option>'; });
  pickHtml += '</select>';
  pickHtml += '<span class="sbs-side-label b" style="margin-left:8px">B</span><select onchange="setSbsPair(\'b\', this.value)">';
  STATE.modelOrder.forEach(function(mk) { pickHtml += '<option value="' + esc(mk) + '"' + (mk === bKey ? ' selected' : '') + '>' + esc(formatModelName(mk)) + '</option>'; });
  pickHtml += '</select>';
  pickHtml += '<span class="spacer"></span><span class="sbs-summary" id="sbs-summary"></span></div>';

  if (!aKey || !bKey || aKey === bKey) {
    sv.innerHTML = pickHtml + '<div style="padding:40px;text-align:center;color:var(--text-dim)">Pick two different models to compare.</div>';
    return;
  }

  var modelA = STATE.models[aKey], modelB = STATE.models[bKey];
  var groupsA = buildGroups(modelA), groupsB = buildGroups(modelB);
  var anchorRes = computeSbsAnchors(groupsA, groupsB);
  STATE.sbsAnchors = anchorRes;

  var scrollHtml = '<div class="sbs-scroll"><div class="sbs-grid">';
  var ctxA = { stepNum: 0 }, ctxB = { stepNum: 0 };

  function emitRun(run) {
    var groupsInA = groupsA.slice(run.aStart, run.aEnd);
    var groupsInB = groupsB.slice(run.bStart, run.bEnd);
    if (!groupsInA.length && !groupsInB.length) return;
    var diff = computeRunDiff(groupsInA, groupsInB);
    var diffClass = 'diff-none';
    if (diff.toolsDiffer) diffClass = 'diff-tools';
    else if (diff.fileDiffCount > 0) diffClass = 'diff-files';
    else if (diff.lengthSkew) diffClass = 'diff-length';

    if (groupsInA.length || groupsInB.length) {
      var leftHtml = '<div class="sbs-cell left ' + diffClass + '">';
      if (groupsInA.length) {
        groupsInA.forEach(function(g, off) { leftHtml += renderGroup(g, run.aStart + off, modelA, { idPrefix: 'a-', ctx: ctxA, hideSaveBtn: true }); });
      } else {
        leftHtml = '<div class="sbs-cell left empty">— no matching turn —</div>';
      }
      leftHtml += groupsInA.length ? '</div>' : '';

      var rightHtml = '<div class="sbs-cell right ' + diffClass + '">';
      if (groupsInB.length) {
        groupsInB.forEach(function(g, off) { rightHtml += renderGroup(g, run.bStart + off, modelB, { idPrefix: 'b-', ctx: ctxB, hideSaveBtn: true }); });
      } else {
        rightHtml = '<div class="sbs-cell right empty">— no matching turn —</div>';
      }
      rightHtml += groupsInB.length ? '</div>' : '';

      scrollHtml += leftHtml + rightHtml;
    }
  }

  // First run (before any anchor)
  emitRun(anchorRes.runs[0]);

  anchorRes.anchors.forEach(function(an, i) {
    var gA = groupsA[an.aIdx], gB = groupsB[an.bIdx];
    var ut = groupUserText(gA) || groupUserText(gB) || '(no user prompt)';
    var diffAfter = computeRunDiff(groupsA.slice(an.aIdx, an.aIdx + 1), groupsB.slice(an.bIdx, an.bIdx + 1));
    var badges = '';
    if (diffAfter.toolsDiffer) badges += '<span class="sbs-badge b-tools">tools differ</span>';
    if (diffAfter.fileDiffCount > 0) badges += '<span class="sbs-badge b-files">files Δ ' + diffAfter.fileDiffCount + '</span>';
    if (diffAfter.lengthSkew) badges += '<span class="sbs-badge b-length">length skew</span>';
    if (!badges) badges = '<span class="sbs-badge b-none">✓ match</span>';

    scrollHtml += '<div class="sbs-anchor">';
    scrollHtml += '<div class="sbs-anchor-header">';
    scrollHtml += '<span class="sbs-anchor-num">Prompt ' + (i + 1) + '</span>';
    scrollHtml += '<span class="sbs-anchor-idx">A #' + (an.aIdx + 1) + ' · B #' + (an.bIdx + 1) + '</span>';
    scrollHtml += badges;
    scrollHtml += '</div>';
    scrollHtml += '<div class="sbs-anchor-body"><div class="msg-user"><div class="msg-user-label">User</div><div class="msg-user-text">' + esc(ut) + '</div></div></div>';
    scrollHtml += '</div>';

    // Render the *single* assistant cells for this anchor (A's response and B's response side-by-side)
    var diffClass = 'diff-none';
    if (diffAfter.toolsDiffer) diffClass = 'diff-tools';
    else if (diffAfter.fileDiffCount > 0) diffClass = 'diff-files';
    else if (diffAfter.lengthSkew) diffClass = 'diff-length';

    var asstOnlyA = { user: null, assistants: gA.assistants, format: gA.format };
    var asstOnlyB = { user: null, assistants: gB.assistants, format: gB.format };
    scrollHtml += '<div class="sbs-cell left ' + diffClass + '">' + renderGroup(asstOnlyA, an.aIdx, modelA, { idPrefix: 'a-', ctx: ctxA, hideSaveBtn: true }) + '</div>';
    scrollHtml += '<div class="sbs-cell right ' + diffClass + '">' + renderGroup(asstOnlyB, an.bIdx, modelB, { idPrefix: 'b-', ctx: ctxB, hideSaveBtn: true }) + '</div>';

    // Then the run that follows this anchor (unmatched turns between this and next anchor)
    var nextRun = anchorRes.runs[i + 1];
    if (nextRun) emitRun(nextRun);
  });

  scrollHtml += '</div></div>';
  sv.innerHTML = pickHtml + scrollHtml;
  var sum = document.getElementById('sbs-summary');
  if (sum) sum.textContent = anchorRes.anchors.length + ' anchors · A:' + groupsA.length + ' B:' + groupsB.length + ' prompts';
}

function setSbsPair(side, key) {
  STATE.sbsPair[side] = key;
  STATE.sbsAnchors = null;
  renderSbsView();
}

/* ═══════════════════════════════════════════════════════════
   DATA HELPERS
   ═══════════════════════════════════════════════════════════ */
function msPromptToIdx(model, msPrompt) {
  if (!msPrompt) return -1;
  var needle = msPrompt.toLowerCase().replace(/\s+/g, ' ').trim();
  var sig = needle.slice(0, 80);
  var bestIdx = -1, bestScore = 0, promptIdx = 0;
  for (var i = 0; i < model.turns.length; i++) {
    if (model.turns[i].role !== 'user') continue;
    var hay = contentToStr(model.turns[i].content).toLowerCase().replace(/\s+/g, ' ').trim();
    if (hay.indexOf(sig) !== -1) return promptIdx;
    var words = sig.split(' ').filter(function(w) { return w.length > 3; });
    if (words.length) {
      var hits = 0;
      words.forEach(function(w) { if (hay.indexOf(w) !== -1) hits++; });
      var score = hits / words.length;
      if (score > bestScore) { bestScore = score; bestIdx = promptIdx; }
    }
    promptIdx++;
  }
  return bestScore >= 0.4 ? bestIdx : -1;
}
function buildMsPromptMap(model) {
  var map = {};
  var used = {};
  (model.metrics.msDetails || []).forEach(function(ms) {
    var idx = msPromptToIdx(model, ms.prompt);
    if (idx >= 0 && !used[idx]) { map[idx] = ms.id; used[idx] = true; }
  });
  return map;
}
function getMilestoneIds() {
  var ids = [];
  STATE.modelOrder.forEach(function(mk) {
    STATE.models[mk].metrics.msDetails.forEach(function(ms) { if (ids.indexOf(ms.id) === -1) ids.push(ms.id); });
  });
  return ids.sort();
}
function findMsDetail(mk, msId) {
  var ds = STATE.models[mk].metrics.msDetails;
  for (var i = 0; i < ds.length; i++) if (ds[i].id === msId) return ds[i];
  return null;
}
function getIntsForMs(mk, msId) {
  var ds = STATE.models[mk].metrics.intDetails, matched = 0, total = 0;
  ds.forEach(function(d) { if (d.milestone === msId) { total++; if (d.matched) matched++; } });
  return { matched: matched, total: total };
}

/* ═══════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════ */
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trunc(s, n) { if (!s) return ''; s = String(s).trim(); return s.length > n ? s.slice(0, n) + '\n\u2026 (truncated)' : s; }
function contentToStr(c) {
  if (!c) return '';
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map(function(p) { return p.text || ''; }).join('\n');
  return String(c);
}
function formatModelName(dir) {
  var n = dir.replace(/^vm-/, '');
  n = n.replace(/-(\d+)-(\d+)/g, ' $1.$2').replace(/-/g, ' ');
  n = n.replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  n = n.replace(/\bGpt\b/g, 'GPT').replace(/\s+Preview$/i, '');
  return n;
}
function toolLabel(tn, inp) {
  if (tn === 'bash') return inp.description || (inp.command ? inp.command.slice(0, 60) : '') || 'bash';
  if (tn === 'read') return (inp.filePath || inp.file_path || inp.path || '').split('/').pop() || 'read';
  if (tn === 'edit' || tn === 'apply_patch') return (inp.filePath || inp.file_path || inp.path || '').split('/').pop() || 'edit';
  if (tn === 'write') return (inp.filePath || inp.file_path || inp.path || '').split('/').pop() || 'write';
  if (tn === 'grep') return 'grep: ' + (inp.pattern || '').slice(0, 40);
  if (tn === 'glob') return 'glob: ' + (inp.pattern || inp.glob_pattern || '').slice(0, 40);
  if (tn === 'question') { var qs = inp.questions || []; return qs.length ? (qs[0].header || qs[0].question || '').slice(0, 60) : 'question'; }
  if (tn === 'todowrite') { var td = inp.todos || []; return td.length + ' item' + (td.length !== 1 ? 's' : ''); }
  return tn;
}
